name: Build PULSE APK

# Runs unit tests and lint, then builds a debug APK and attaches it to the run as a download.
# Runs on every push, and can be triggered manually from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
